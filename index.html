<script>
'use strict';
/* ---------- helpers ---------- */
function scaleSvgs(){
  document.querySelectorAll('svg[width]').forEach(v=>{
    if(v.dataset.sc) return; const w=v.getAttribute('width'), h=v.getAttribute('height');
    if(!w || /%/.test(w)) return;
    v.style.width=`calc(${w} * 2.4 * var(--u))`; v.style.height=`calc(${h} * 2.4 * var(--u))`; v.dataset.sc=1;
  });
}

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const LS = { get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- IndexedDB ---------- */
let dbp;
function db(){ if(dbp) return dbp; dbp = new Promise((res,rej)=>{
  const r = indexedDB.open('auan',1);
  r.onupgradeneeded = () => { const s=r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true}); s.createIndex('date','date'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}); return dbp; }
async function tx(mode, fn){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('photos',mode); const out=fn(t.objectStore('photos')); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined); t.onerror=()=>rej(t.error); }); }
const dbAll = () => tx('readonly', s => s.getAll());
const dbAdd = p => tx('readwrite', s => s.add(p));
const dbDel = id => tx('readwrite', s => s.delete(id));
const dbClear = () => tx('readwrite', s => s.clear());

/* ---------- state ---------- */
let photos = [];            // all photos sorted by ts
let byDay = {};             // dateKey -> [photos]
const thumbURLs = {};
let settings = { name: LS.get('auan_name','Auan'), bday: LS.get('auan_bday',''), streak: LS.get('auan_streak',true), avatar: LS.get('auan_avatar','') };

async function reload(){
  photos = (await dbAll()).sort((a,b)=>a.ts-b.ts);
  byDay = {};
  Object.values(thumbURLs).forEach(u=>URL.revokeObjectURL(u));
  for(const k in thumbURLs) delete thumbURLs[k];
  photos.forEach(p => { (byDay[p.date] = byDay[p.date] || []).push(p); thumbURLs[p.id] = URL.createObjectURL(p.thumb || p.blob); });
  renderMemories(); renderStats();
}

/* ---------- navigation ---------- */
let cur = 'home';
function go(name){
  cur = name;
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-'+name));
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  if(name === 'home') startCam(); else stopCam();
  if(name === 'mem'){ renderMemories(); setTimeout(()=>{const s=$('#memScroll'); s.scrollTop = s.scrollHeight;},30); }
}
$$('.nav button').forEach(b => b.onclick = () => go(b.dataset.go));
$('#histBtn').onclick = () => go('mem');
$('#btnCompose').onclick = () => toast('ระบบแช็ตยังไม่เปิดใช้ ต้องมีเซิร์ฟเวอร์ก่อน');
$('#btnHint').onclick = () => toast('วิดเจ็ตหน้าจอหลักต้องใช้แอปมือถือจริง');
$('#btnFriends').onclick = () => $('#sheetBg').classList.add('on');
$('#sheetBg').onclick = e => { if(e.target === e.currentTarget) e.currentTarget.classList.remove('on'); };

/* ---------- camera ---------- */
let stream = null, facing = 'environment', torchOn = false, camBusy = false;
const video = $('#video');
async function startCam(){
  if(camBusy || stream) return;
  camBusy = true;
  const err = $('#camErr');
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('nosupport');
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1920} }, audio:false });
    video.srcObject = stream;
    video.classList.toggle('mirror', facing === 'user');
    err.classList.remove('on');
    applyTorch();
  }catch(e){
    $('#camMsg').textContent = e.message === 'nosupport' ? 'เบราว์เซอร์นี้ไม่รองรับกล้อง (ต้องเปิดผ่าน https)' : 'ไม่ได้รับอนุญาตให้ใช้กล้อง กดปุ่มด้านล่างแล้วอนุญาต';
    err.classList.add('on');
  }
  camBusy = false;
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null; } }
async function applyTorch(){
  const t = stream?.getVideoTracks()[0]; if(!t) return;
  try{ const caps = t.getCapabilities?.(); if(caps && caps.torch) await t.applyConstraints({ advanced:[{torch:torchOn}] }); }catch(e){}
}
$('#btnAllow').onclick = startCam;
$('#btnFlip').onclick = () => { facing = facing==='user' ? 'environment' : 'user'; stopCam(); startCam(); };
$('#btnFlash').onclick = () => { torchOn = !torchOn; $('#btnFlash').classList.toggle('on', torchOn); applyTorch(); };

function squareCanvas(src, sw, sh, mirror, size=1080){
  const s = Math.min(sw, sh), sx = (sw-s)/2, sy = (sh-s)/2;
  const c = document.createElement('canvas'); c.width = c.height = Math.min(size, s);
  const x = c.getContext('2d');
  if(mirror){ x.translate(c.width,0); x.scale(-1,1); }
  x.drawImage(src, sx, sy, s, s, 0, 0, c.width, c.height);
  return c;
}
const toBlob = (c,q=.9) => new Promise(r => c.toBlob(r,'image/jpeg',q));

let pending = null;   // {blob, thumb}
async function showPreview(canvas){
  const blob = await toBlob(canvas), tc = document.createElement('canvas'); tc.width=tc.height=300;
  tc.getContext('2d').drawImage(canvas,0,0,300,300);
  pending = { blob, thumb: await toBlob(tc,.8) };
  $('#pvImg').src = URL.createObjectURL(blob);
  $('#pvCap').value = '';
  $('#preview').classList.add('on'); document.body.classList.add('hidenav');
  if(window.onPreviewOpen) window.onPreviewOpen();
}
$('#btnShot').onclick = async () => {
  if(!stream || !video.videoWidth){ toast('กล้องยังไม่พร้อม'); return; }
  const t = stream.getVideoTracks()[0]; const hasTorch = !!t.getCapabilities?.().torch;
  if(torchOn && !hasTorch){ const w=$('#flashWhite'); w.classList.add('on'); await new Promise(r=>setTimeout(r,200)); }
  const c = squareCanvas(video, video.videoWidth, video.videoHeight, facing==='user');
  $('#flashWhite').classList.remove('on');
  showPreview(c);
};
$('#btnPick').onclick = () => $('#filePick').click();
$('#filePick').onchange = async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const bmp = await createImageBitmap(f); showPreview(squareCanvas(bmp, bmp.width, bmp.height, false)); }catch(err){ toast('เปิดรูปนี้ไม่ได้'); }
};
function closePreview(){ $('#preview').classList.remove('on'); document.body.classList.remove('hidenav'); pending=null; }
$('#pvCancel').onclick = closePreview;
$('#pvSave').onclick = async () => {
  if(!pending) return;
  let to = [];
  if(window.chooseRecipients){ to = await window.chooseRecipients(); if(to === null) return; }
  const now = new Date();
  await dbAdd({ date: dkey(now), ts: now.getTime(), caption: $('#pvCap').value.trim(), blob: pending.blob, thumb: pending.thumb });
  const pend = pending, cap = $('#pvCap').value.trim();
  closePreview(); await reload();
  let sent = false;
  if(window.onPhotoSaved){ try{ sent = await window.onPhotoSaved(pend, cap, to); }catch(e){ toast('ส่งรูปให้เพื่อนไม่สำเร็จ'); } }
  toast(sent ? 'บันทึกและส่งให้เพื่อนแล้ว 💗' : 'บันทึกแล้ว 💗');
};
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
$('#pvDl').onclick = () => pending && download(pending.blob, `auan-${Date.now()}.jpg`);

/* ---------- memories / calendar ---------- */
const connSVG = flip => `<svg width="90" height="32" viewBox="0 0 110 40" fill="none" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11" ${flip?'transform="scale(-1,1)"':''}><path d="M30 6c12 20 40 6 52 26"/></svg>`;
function renderMemories(){
  const wrap = $('#months'); wrap.innerHTML = '';
  const now = new Date(), today = dkey(now);
  let start = new Date(now.getFullYear(), now.getMonth()-1, 1);
  if(photos.length){ const f = new Date(photos[0].ts); const fm = new Date(f.getFullYear(), f.getMonth(), 1); if(fm < start) start = fm; }
  const end = new Date(now.getFullYear(), now.getMonth(), 1);
  let i = 0;
  for(let m = new Date(start); m <= end; m = new Date(m.getFullYear(), m.getMonth()+1, 1), i++){
    if(i){ const c=document.createElement('div'); c.className='conn'; c.innerHTML=connSVG(i%2); wrap.appendChild(c); }
    const card = document.createElement('div'); card.className='month';
    card.innerHTML = `<h2>${MONTHS[m.getMonth()]} ${m.getFullYear()}</h2>`;
    const g = document.createElement('div'); g.className='grid';
    const first = m.getDay(), days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    for(let b=0;b<first;b++){ const e=document.createElement('div'); e.className='cell'; g.appendChild(e); }
    for(let d=1; d<=days; d++){
      const k = `${m.getFullYear()}-${pad(m.getMonth()+1)}-${pad(d)}`;
      const cell = document.createElement('div'); cell.className='cell';
      const list = byDay[k];
      if(list){
        const last = list[list.length-1];
        cell.classList.add('photo'); cell.style.backgroundImage = `url(${thumbURLs[last.id]})`;
        if(list.length>1) cell.innerHTML = `<span class="cnt">${list.length}</span>`;
        cell.onclick = () => openViewer(k);
        if(k===today) cell.classList.add('today');
      } else if(k === today){ cell.classList.add('today'); cell.innerHTML = '<svg width="44%" height="44%" viewBox="0 0 24 24" stroke="#ff5fa2" stroke-width="3.5" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>'; cell.onclick=()=>go('home'); }
      else if(k > today) cell.classList.add('future');
      else cell.classList.add('dot');
      g.appendChild(cell);
    }
    card.appendChild(g); wrap.appendChild(card);
  }
  scaleSvgs();
}
function calcStreak(){
  let d = new Date(); if(!byDay[dkey(d)]) d.setDate(d.getDate()-1);
  let n = 0; while(byDay[dkey(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}
function renderStats(){
  $('#stTotal').textContent = `${photos.length} Auan`;
  $('#stStreak').textContent = `${calcStreak()}d streak`;
  $('#stStreak').closest('span').style.display = settings.streak ? '' : 'none';
  $('.stats hr').style.display = settings.streak ? '' : 'none';
}

/* viewer */
let vList = [], vIdx = 0, vUrl = '';
function openViewer(k){ vList = byDay[k] || []; vIdx = vList.length-1; if(!vList.length) return; showV(); $('#viewer').classList.add('on'); document.body.classList.add('hidenav'); }
function showV(){
  const p = vList[vIdx]; if(vUrl) URL.revokeObjectURL(vUrl);
  vUrl = URL.createObjectURL(p.blob); $('#vwImg').src = vUrl;
  const d = new Date(p.ts);
  $('#vwDate').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}  ${pad(d.getHours())}:${pad(d.getMinutes())}` + (vList.length>1 ? `  (${vIdx+1}/${vList.length})` : '');
  const c = $('#vwCap'); c.style.display = p.caption ? '' : 'none'; c.textContent = p.caption || '';
  $('#vwPrev').style.visibility = $('#vwNext').style.visibility = vList.length>1 ? 'visible' : 'hidden';
}
$('#vwClose').onclick = () => { $('#viewer').classList.remove('on'); document.body.classList.remove('hidenav'); };
$('#vwPrev').onclick = () => { vIdx = (vIdx-1+vList.length)%vList.length; showV(); };
$('#vwNext').onclick = () => { vIdx = (vIdx+1)%vList.length; showV(); };
$('#vwDl').onclick = () => download(vList[vIdx].blob, `auan-${vList[vIdx].date}-${vList[vIdx].ts}.jpg`);
$('#vwDel').onclick = async () => {
  if(!confirm('ลบรูปนี้?')) return;
  await dbDel(vList[vIdx].id); $('#vwClose').onclick(); await reload(); toast('ลบรูปแล้ว');
};

/* ---------- profile ---------- */
function initials(n){ const w = n.trim().split(/\s+/).filter(Boolean); if(!w.length) return 'A'; return (w[0][0] + (w[1]?w[1][0]:'')).toUpperCase(); }
function renderProfile(){
  $$('.av').forEach(a => { if(settings.avatar){ a.style.backgroundImage=`url(${settings.avatar})`; a.textContent=''; } else { a.style.backgroundImage=''; a.textContent = initials(settings.name); } });
  $('#pName').textContent = settings.name; $('#rName').textContent = settings.name;
  $('#rBday').textContent = settings.bday || 'ยังไม่ได้ตั้งค่า';
  $('#swStreak').classList.toggle('on', settings.streak);
  $('#shareUrl').textContent = location.href.replace(/index\.html$/,'').replace(/^https?:\/\//,'');
  renderStats();
}
$$('[data-profile]').forEach(b => b.onclick = () => { $('#p-profile').classList.add('on'); document.body.classList.add('hidenav'); });
$('#pBack').onclick = () => { $('#p-profile').classList.remove('on'); document.body.classList.remove('hidenav'); };
$('#rowName').onclick = () => { const v = prompt('ชื่อของคุณ', settings.name); if(v && v.trim()){ settings.name=v.trim().slice(0,30); LS.set('auan_name',settings.name); renderProfile(); if(window.onProfileChanged) window.onProfileChanged(); } };
$('#rowBday').onclick = () => { const v = prompt('วันเกิด (เช่น 15 มิถุนายน)', settings.bday); if(v!==null){ settings.bday=v.trim(); LS.set('auan_bday',settings.bday); renderProfile(); } };
$('#rowStreak').onclick = () => { settings.streak=!settings.streak; LS.set('auan_streak',settings.streak); renderProfile(); };
$('#btnEditPhoto').onclick = () => $('#avPick').click();
$('#avPick').onchange = async e => {
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const bmp=await createImageBitmap(f); const c=squareCanvas(bmp,bmp.width,bmp.height,false,256); settings.avatar=c.toDataURL('image/jpeg',.8); LS.set('auan_avatar',settings.avatar); renderProfile(); if(window.onProfileChanged) window.onProfileChanged(); }catch(err){ toast('เปิดรูปนี้ไม่ได้'); }
};
$('#btnShare').onclick = async () => {
  const url = location.href.replace(/index\.html$/,'');
  if(navigator.share){ try{ await navigator.share({ title:'Auan', text:'มาใช้ Auan ด้วยกัน', url }); }catch(e){} }
  else { try{ await navigator.clipboard.writeText(url); toast('คัดลอกลิงก์แล้ว'); }catch(e){ prompt('คัดลอกลิงก์นี้', url); } }
};
let deferredInstall;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
$('#rowInstall').onclick = async () => {
  if(deferredInstall){ deferredInstall.prompt(); deferredInstall=null; }
  else toast('เปิดเมนูเบราว์เซอร์ แล้วเลือก "เพิ่มไปยังหน้าจอหลัก"');
};
$('#rowAbout').onclick = () => alert('Auan\nถ่ายรูปแล้วเก็บเป็นความทรงจำรายวัน\nรูปทั้งหมดเก็บไว้ในเครื่องของคุณเท่านั้น');
$('#rowClear').onclick = async () => { if(confirm('ลบรูปทั้งหมดในแอป? ย้อนกลับไม่ได้')){ await dbClear(); await reload(); toast('ลบรูปทั้งหมดแล้ว'); } };

/* ---------- boot ---------- */
document.addEventListener('visibilitychange', () => { if(document.hidden) stopCam(); else if(cur==='home') startCam(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.getSettings = () => settings;
window.setProfile = o => { Object.assign(settings, o); if('name' in o) LS.set('auan_name', settings.name); if('avatar' in o) LS.set('auan_avatar', settings.avatar); renderProfile(); };
scaleSvgs(); renderProfile();
reload().then(() => startCam());
</script>
